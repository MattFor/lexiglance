line-length = 120
target-version = "py310"

[format]
indent-style = "tab"
quote-style = "preserve"
skip-magic-trailing-comma = false

[lint]
select = ["E4", "E7", "E9", "F", "B", "C4", "PIE", "SIM", "UP", "ARG", "PLE", "PLW", "FURB", "RUF"]

[lint.per-file-ignores]
# Benchmark text: the full-width and Greek characters are meant
"tools/ocr-bench/gen.py" = ["RUF001"]
