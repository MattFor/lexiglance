name: Feature request
description: An idea to make Lexiglance better
labels: [enhancement]
body:
    - type: textarea
      id: problem
      attributes:
          label: What would you like to do
          description: The situation and what gets in the way today.
      validations:
          required: true
    - type: textarea
      id: idea
      attributes:
          label: How it could work
    - type: textarea
      id: alternatives
      attributes:
          label: Alternatives or workarounds you tried
