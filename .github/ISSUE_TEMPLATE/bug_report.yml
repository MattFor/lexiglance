name: Bug report
description: Something does not work as it should
labels: [bug]
body:
    - type: textarea
      id: what
      attributes:
          label: What happened
          description: What you did, what you expected and what happened instead. Screenshots help a lot for popup and OCR issues.
      validations:
          required: true
    - type: textarea
      id: steps
      attributes:
          label: Steps to reproduce
          placeholder: |
              1. Open ...
              2. Hold the trigger over ...
      validations:
          required: true
    - type: input
      id: version
      attributes:
          label: Lexiglance version
          description: Shown by `lexiglancectl status` or `lexiglanced --version`.
      validations:
          required: true
    - type: input
      id: system
      attributes:
          label: System
          description: Distribution, desktop or window manager, X11 or Wayland, compositor on or off.
      validations:
          required: true
    - type: textarea
      id: log
      attributes:
          label: Daemon log
          description: Run `lexiglanced --replace --verbose` and reproduce the problem; paste the relevant lines.
          render: text
