name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APT_PACKAGES: >-
    ninja-build zlib1g-dev libcairo2-dev libpango1.0-dev libx11-dev libxi-dev libxfixes-dev libxrandr-dev
    libxext-dev libatspi2.0-dev libcurl4-openssl-dev libgl-dev libxkbcommon-dev qt6-base-dev

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install clang-format
        run: pipx install clang-format==23.1.0
      - name: Check formatting
        run: git ls-files '*.cpp' '*.h' '*.mm' ':!:third_party/**' | xargs clang-format --dry-run --Werror
      - name: Install ruff
        run: pipx install ruff==0.16.5
      - name: Ruff
        run: |
          ruff check --output-format=github .
          ruff format --check .

  linux:
    name: Linux (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC 14
            cxx: g++-14
          - name: Clang 20
            cxx: clang++-20
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086 # a list of packages, split on purpose
          sudo apt-get install -y $APT_PACKAGES g++-14
      - name: Install Clang
        if: startsWith(matrix.cxx, 'clang')
        run: wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 20
      - name: Configure
        # The tools too (tools/): nothing else builds them, and they are of no use once they no longer compile.
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DLEXIGLANCE_WARNINGS_AS_ERRORS=ON -DLEXIGLANCE_BUILD_TOOLS=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: Sanitizers (ASan + UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086 # a list of packages, split on purpose
          sudo apt-get install -y $APT_PACKAGES g++-14
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 20
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++-20
          -DLEXIGLANCE_SANITIZE=ON -DLEXIGLANCE_BUILD_GUI=OFF
      - name: Build
        run: cmake --build build
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/tests/lsan.supp:print_suppressions=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure

  tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086 # a list of packages, split on purpose
          sudo apt-get install -y $APT_PACKAGES g++-14
          pipx install clang-tidy==21.1.1
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=g++-14 -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Run clang-tidy
        # Same-OS platform sources only: tidying X11 on a machine without X headers (or Windows sources on Linux)
        # fails the first missing include and then reports a cascade of false positives.
        run: >-
          git ls-files 'src/*.cpp' 'apps/*.cpp' 'tests/*.cpp'
          ':!:src/platform/windows/*' ':!:src/platform/linux/*'
          | xargs -P "$(nproc)" -n 4 clang-tidy -p build --quiet --warnings-as-errors='*'
      - name: Run clang-tidy (Linux platform)
        run: >-
          git ls-files 'src/platform/linux/*.cpp'
          | xargs -P "$(nproc)" -n 4 clang-tidy -p build --quiet --warnings-as-errors='*'

  fedora:
    name: Fedora (GCC, .rpm package)
    # What the release's .rpm is built on: it builds, passes the tests, installs with dnf and uninstalls with rpm.
    # Fedora moves to new GCC and Qt releases quickly, so its warnings are reported but do not fail the build.
    runs-on: ubuntu-24.04
    container: fedora:42
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: >-
          dnf install -y gcc-c++ cmake ninja-build pkgconf-pkg-config rpm-build zlib-devel cairo-devel pango-devel
          libX11-devel libXi-devel libXfixes-devel libXrandr-devel libXext-devel at-spi2-core-devel libcurl-devel
          mesa-libGL-devel libxkbcommon-devel qt6-qtbase-devel dejavu-sans-fonts
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package
        run: cd build && cpack -G RPM
      - name: Install and uninstall the package
        run: |
          dnf install -y ./build/lexiglance-*.rpm
          lexiglanced --version
          rpm -e lexiglance
          test ! -e /usr/bin/lexiglanced

  windows:
    name: Windows (MinGW-w64, tests under wine)
    runs-on: ubuntu-24.04
    container: fedora:41
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: dnf install -y cmake ninja-build mingw64-gcc-c++ mingw64-zlib-static wine-core
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja --toolchain cmake/toolchains/mingw-w64.cmake -DCMAKE_BUILD_TYPE=Release
          -DLEXIGLANCE_BUILD_DAEMON=OFF -DLEXIGLANCE_BUILD_GUI=OFF
      - name: Build
        run: cmake --build build
      - name: Test
        env:
          WINEDEBUG: '-all'
          # The container runs as root with a HOME it does not own, where wine refuses to make its prefix.
          WINEPREFIX: /tmp/wine
        run: ctest --test-dir build --output-on-failure

  windows-native:
    name: Windows (native, MSYS2 UCRT64)
    # Everything: the daemon with its Windows backend, the settings application and all tests. MSYS2 moves to new GCC
    # releases quickly, so its warnings are reported but do not fail the build.
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-zlib mingw-w64-ucrt-x86_64-cairo mingw-w64-ucrt-x86_64-pango mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-qt6-base
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package
        run: |
          cmake --install build --prefix stage
          cd build && cpack -G ZIP
      - name: Installer
        shell: pwsh
        run: ./.github/scripts/windows-installer.ps1 build stage build
      - name: Smoke test the packages
        # Unpacked and installed, with nothing but Windows on PATH: every DLL and Qt plugin the programs load must be there.
        shell: pwsh
        run: |
          ./.github/scripts/smoke-test-windows.ps1 (Get-ChildItem build/lexiglance-*.zip | Select-Object -First 1).FullName
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./.github/scripts/smoke-test-windows.ps1 (Get-ChildItem build/*-setup.exe | Select-Object -First 1).FullName
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # Without the settings window: the daemon and lexiglancectl must not miss what was left out with it.
          ./.github/scripts/smoke-test-windows.ps1 (Get-ChildItem build/*-setup.exe | Select-Object -First 1).FullName -NoGui

  macos:
    name: macOS (${{ matrix.arch }})
    # Lexiglance.app for one architecture, on a Mac of that architecture; macos-universal merges the two. Pango, Cairo
    # and the libraries they use are built for macOS 13.3 by macos-deps.sh (cached until it changes): Homebrew's and
    # MacPorts' builds need the runner's macOS (15). Qt's own build is universal and needs macOS 12.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    env:
      QT_VERSION: '6.8.3'
    steps:
      - uses: actions/checkout@v7
      - name: Install the build tools
        run: |
          pipx install ninja==1.13.2
          pipx environment --value PIPX_BIN_DIR >> "$GITHUB_PATH"
          pipx run --spec aqtinstall aqt install-qt mac desktop "$QT_VERSION" clang_64 -O "$RUNNER_TEMP/Qt"
          echo "QT_DIR=$RUNNER_TEMP/Qt/$QT_VERSION/macos" >> "$GITHUB_ENV"
      - name: Restore the libraries
        id: deps
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/deps
          key: macos-deps-${{ matrix.arch }}-${{ hashFiles('.github/scripts/macos-deps.sh') }}
      - name: Build the libraries
        if: steps.deps.outputs.cache-hit != 'true'
        run: |
          pipx install meson==1.12.1
          bash .github/scripts/macos-deps.sh "$RUNNER_TEMP/deps"
      - name: Cache the libraries
        # Saved now, so a failing build below does not throw them away.
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/deps
          key: ${{ steps.deps.outputs.cache-primary-key }}
      - name: Configure
        # Homebrew's libraries stay out (the runners have some): zlib and libcurl are the system's, pkg-config is the
        # one in deps (it looks only there). The deployment target is CMakeLists.txt's, 13.3.
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLEXIGLANCE_WARNINGS_AS_ERRORS=ON
          -DCMAKE_PREFIX_PATH="$QT_DIR;$RUNNER_TEMP/deps" -DCMAKE_IGNORE_PREFIX_PATH="/opt/homebrew;/usr/local"
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Bundle
        # Archived: an artifact keeps neither the symbolic links in Qt's frameworks nor the programs' executable bits.
        run: |
          bash .github/scripts/macos-package.sh bundle build bundle/Lexiglance.app
          tar -C bundle -czf "lexiglance-macos-${{ matrix.arch }}.tar.gz" Lexiglance.app
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: lexiglance-macos-${{ matrix.arch }}.tar.gz
          retention-days: 1

  macos-universal:
    name: macOS (universal disk image)
    # The release publishes this disk image (release.yml downloads package-*).
    needs: macos
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: macos-*
          merge-multiple: true
      - name: Disk image
        run: |
          for arch in arm64 x86_64; do
            mkdir -p "$arch" && tar -C "$arch" -xzf "lexiglance-macos-$arch.tar.gz"
          done
          bash .github/scripts/macos-package.sh dmg dist arm64/Lexiglance.app x86_64/Lexiglance.app
      - name: Install Rosetta
        # For the x86_64 half of the smoke test.
        run: arch -x86_64 /usr/bin/true || sudo softwareupdate --install-rosetta --agree-to-license
      - name: Smoke test the disk image
        # On a Mac without the libraries or Qt, in both architectures: everything the programs load must be in the app,
        # and built for the macOS the app says it needs.
        run: bash .github/scripts/macos-package.sh test dist/Lexiglance-macos.dmg
      - uses: actions/upload-artifact@v7
        with:
          name: package-macos
          path: dist/Lexiglance-macos.dmg
          retention-days: 7
