name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  APT_PACKAGES: >-
    ninja-build zlib1g-dev libcairo2-dev libpango1.0-dev libx11-dev libxi-dev libxfixes-dev libxrandr-dev
    libxext-dev libatspi2.0-dev libcurl4-openssl-dev libgl-dev libxkbcommon-dev

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  linux:
    name: Linux packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086 # a list of packages, split on purpose
          sudo apt-get install -y $APT_PACKAGES qt6-base-dev dpkg-dev file g++-14
      - name: Configure
        # x86-64-v2 runs on every x86-64 CPU since about 2009; build with -DLEXIGLANCE_NATIVE=ON for your own CPU.
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-14
          -DCMAKE_INSTALL_PREFIX=/usr -DLEXIGLANCE_ARCH=x86-64-v2
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Packages (.tar.gz, .deb)
        run: |
          cd build && cpack
          mkdir -p ../dist && mv lexiglance-*.tar.gz lexiglance_*.deb ../dist/
      - uses: actions/upload-artifact@v7
        with:
          name: package-linux
          path: dist/*

  appimage:
    name: AppImage
    # The Linux download that needs no installing, so no release goes out without it. Built on the oldest Ubuntu LTS
    # still supported (glibc 2.35), so it runs there and on everything newer; the AppImage catalog tests it on 22.04.
    # 22.04's own GCC and Qt are too old: GCC 14 comes from the toolchain PPA, Qt from Qt's own build, and the checkrt
    # plugin bundles GCC's libstdc++, used only where the system's is older. Its exec.so stays out: it would give the
    # programs Lexiglance starts from its own mount (the daemon, the updater) the environment without that libstdc++.
    runs-on: ubuntu-22.04
    env:
      QT_VERSION: '6.8.3'
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          # zsync for the AppImage's .zsync; the libraries Qt's xcb plugin needs, for linuxdeploy to bundle.
          # shellcheck disable=SC2086 # a list of packages, split on purpose
          sudo apt-get install -y $APT_PACKAGES g++-14 zsync libfontconfig1-dev libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
          pip install aqtinstall
          python3 -m aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 -O "$RUNNER_TEMP/Qt"
          echo "QT_DIR=$RUNNER_TEMP/Qt/$QT_VERSION/gcc_64" >> "$GITHUB_ENV"
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-14
          -DCMAKE_INSTALL_PREFIX=/usr -DLEXIGLANCE_ARCH=x86-64-v2 -DCMAKE_PREFIX_PATH="$QT_DIR"
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          # For AppImageUpdate and the like: the .zsync of the newest release, which appimagetool makes with zsyncmake.
          UPDATE_INFORMATION: gh-releases-zsync|MattFor|lexiglance|latest|lexiglance-x86_64.AppImage.zsync
        run: |
          DESTDIR="$PWD/AppDir" cmake --install build
          # Fixed releases, checked: "continuous" builds change under a release (appimagetool's of 31-10-2026 refused the
          # SVG icon 1.3.6 shipped with). Change a version and its hash together, then run this workflow by hand.
          url=https://github.com
          curl -fsSLO "$url/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage"
          curl -fsSLO "$url/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-x86_64.AppImage"
          curl -fsSLO "$url/darealshinji/linuxdeploy-plugin-checkrt/releases/download/r4/linuxdeploy-plugin-checkrt.sh"
          curl -fsSLO "$url/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage"
          sha256sum -c - <<'EOF'
          c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  linuxdeploy-x86_64.AppImage
          15106be885c1c48a021198e7e1e9a48ce9d02a86dd0a1848f00bdbf3c1c92724  linuxdeploy-plugin-qt-x86_64.AppImage
          292a0e13cdfd4686cc02dd9ebef95743ded0d22d19f0dad659af4b3e531d26e3  linuxdeploy-plugin-checkrt.sh
          ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool-x86_64.AppImage
          EOF
          chmod +x linuxdeploy* appimagetool-x86_64.AppImage
          export QMAKE="$QT_DIR/bin/qmake" LD_LIBRARY_PATH="$QT_DIR/lib"
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --plugin checkrt \
            --desktop-file AppDir/usr/share/applications/io.github.mattfor.lexiglance.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/scalable/apps/lexiglance.svg \
            --executable AppDir/usr/bin/lexiglanced --executable AppDir/usr/bin/lexiglancectl
          # Qt 5's (later plugin releases leave it out): it would point Qt 6 at a GTK theme plugin it does not have.
          rm -f AppDir/apprun-hooks/linuxdeploy-plugin-qt-hook.sh
          rm AppDir/checkrt/exec.so
          # The hook's "$CHECKRT_LIBS:$LD_LIBRARY_PATH" ends in ':' when LD_LIBRARY_PATH is unset: the working directory.
          hook=AppDir/apprun-hooks/linuxdeploy-plugin-checkrt.sh
          # shellcheck disable=SC2016 # the hook's own variables, not the step's
          sed -i 's/"${CHECKRT_LIBS}:${LD_LIBRARY_PATH}"/"${CHECKRT_LIBS}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"/' "$hook"
          grep -qF 'LD_LIBRARY_PATH:+' "$hook"
          # The AppImage's own icon (.DirIcon) is made from a PNG in the top level.
          cp data/windows/lexiglance.png AppDir/lexiglance.png
          # Under its published name and from dist: zsyncmake writes the .zsync to the working directory, and the file
          # name it records there is the one AppImageUpdate downloads.
          mkdir -p dist && cd dist
          ../appimagetool-x86_64.AppImage -u "$UPDATE_INFORMATION" ../AppDir lexiglance-x86_64.AppImage
          test -s lexiglance-x86_64.AppImage.zsync
          [ "$(./lexiglance-x86_64.AppImage --appimage-updateinformation)" = "$UPDATE_INFORMATION" ]
          # Started as a user starts it: the runtime, AppRun and its hooks, the bundled libraries, then the daemon.
          ./lexiglance-x86_64.AppImage --daemon --version
      - uses: actions/upload-artifact@v7
        with:
          name: package-appimage
          path: dist/*

  fedora:
    name: Fedora package (.rpm)
    # Built on Fedora against its own libraries, so the package's automatic requirements are ones Fedora has.
    runs-on: ubuntu-24.04
    container: fedora:42
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: >-
          dnf install -y gcc-c++ cmake ninja-build pkgconf-pkg-config rpm-build zlib-devel cairo-devel pango-devel
          libX11-devel libXi-devel libXfixes-devel libXrandr-devel libXext-devel at-spi2-core-devel libcurl-devel
          mesa-libGL-devel libxkbcommon-devel qt6-qtbase-devel dejavu-sans-fonts
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          -DLEXIGLANCE_ARCH=x86-64-v2
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package
        run: |
          cd build && cpack -G RPM
          mkdir -p ../dist && mv lexiglance-*.rpm ../dist/
      - name: Check the package installs
        run: |
          dnf install -y ./dist/lexiglance-*.rpm
          lexiglanced --version
          rpm -e lexiglance
      - uses: actions/upload-artifact@v7
        with:
          name: package-rpm
          path: dist/*

  windows:
    name: Windows packages (MSYS2 UCRT64)
    # The daemon, the settings application and lexiglancectl with the DLLs and Qt plugins they load: an installer that
    # needs no administrator rights, and the same files as a .zip.
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-zlib mingw-w64-ucrt-x86_64-cairo mingw-w64-ucrt-x86_64-pango mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-qt6-base
      - name: Build, test and package
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLEXIGLANCE_ARCH=x86-64-v2
          cmake --build build
          ctest --test-dir build --output-on-failure
          cmake --install build --prefix stage
          cd build && cpack -G ZIP
          mkdir -p ../dist && mv lexiglance-*.zip ../dist/
      - name: Installer
        shell: pwsh
        run: ./.github/scripts/windows-installer.ps1 build stage dist
      - name: Smoke test the packages
        # Unpacked and installed, with nothing but Windows on PATH: every DLL and Qt plugin the programs load must be there.
        shell: pwsh
        run: |
          ./.github/scripts/smoke-test-windows.ps1 (Get-ChildItem dist/*.zip | Select-Object -First 1).FullName
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./.github/scripts/smoke-test-windows.ps1 (Get-ChildItem dist/*-setup.exe | Select-Object -First 1).FullName
      - uses: actions/upload-artifact@v7
        with:
          name: package-windows
          path: dist/*

  publish:
    name: Publish
    needs: [ci, linux, appimage, fedora, windows]
    # A manual run builds and tests the packages without publishing them.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag against the version
        # The same pattern as the release script
        run: |
          v=${GITHUB_REF_NAME#v}
          found=$(sed -Ezn 's/.*project\([^)]*VERSION[[:space:]]+([0-9][^[:space:])]*).*/\1/p' CMakeLists.txt | tr -d '\0')
          [ "$found" = "$v" ] || { echo "::error file=CMakeLists.txt::CMakeLists.txt says $found, the tag says $v"; exit 1; }
      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          merge-multiple: true
          path: dist
      - name: Stable file names
        # The same names in every release, so links to releases/latest/download/<name> (the README's) always give the
        # newest version. The version is in the release's title and in the files themselves. Lexiglance's own updater
        # (apps/gui/UpdateGroup.cpp) downloads them by these names too, checked against SHA256SUMS.
        working-directory: dist
        run: |
          mv lexiglance-*-windows-setup.exe lexiglance-windows-setup.exe
          mv lexiglance-*-windows-*.zip lexiglance-windows-portable.zip
          mv lexiglance_*.deb lexiglance-amd64.deb
          mv lexiglance-*.x86_64.rpm lexiglance-x86_64.rpm
          mv lexiglance-*-linux-*.tar.gz lexiglance-linux-x86_64.tar.gz
          sha256sum -- * > SHA256SUMS
      - name: Notes
        # Which file to download comes first; the changes of this version follow, from CHANGELOG.md.
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "- **Windows 10 and 11:** run \`lexiglance-windows-setup.exe\`. It needs no administrator rights and opens Lexiglance when it is done. \`lexiglance-windows-portable.zip\` is the same without installing."
            echo "- **Linux:** make \`lexiglance-x86_64.AppImage\` executable and run it, or install \`lexiglance-amd64.deb\` on Debian and Ubuntu, \`lexiglance-x86_64.rpm\` on Fedora."
            echo
            awk -v v="$version" '/^## \[/{ found = index($0, "[" v "]") > 0; next } found' CHANGELOG.md
          } > notes.md
      - uses: softprops/action-gh-release@v3
        with:
          name: Lexiglance ${{ github.ref_name }}
          files: dist/*
          body_path: notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
